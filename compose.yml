services:
  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: the-grounds-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persist generated images
      - ./backend/static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/generate').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - the-grounds-network

  # Vite + React Frontend
  frontend:
    build:
      context: ./the-grounds
      dockerfile: Dockerfile
    container_name: the-grounds-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - the-grounds-network

networks:
  the-grounds-network:
    driver: bridge

volumes:
  backend-static:
    driver: local
